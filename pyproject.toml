[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-organizer-agent"
version = "0.1.0"
description = "Multi-agent system that runs the full meeting lifecycle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "langgraph>=0.0.30",
    "mcp>=0.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "dateparser>=1.2.0",
    "apscheduler>=3.10.4",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.6.0",
    "faster-whisper>=1.0.1",
    "weasyprint>=61.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "jiwer>=3.0.3",
    "scikit-learn>=1.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "backend/tests",
]
pythonpath = [
    ".",
    "backend",
]
asyncio_mode = "auto"
